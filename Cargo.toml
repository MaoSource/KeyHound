[package]
name = "keyhound"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.29"
egui_extras = "0.29"

# RustCrypto: symmetric ciphers
aes = "0.8"
des = "0.8"
sm4 = "0.5"
cbc = "0.1"
cfb-mode = "0.8"
ctr = "0.9"
ecb = "0.1"
aes-gcm = "0.10"
cipher = "0.4"

# Stream ciphers
rc4 = "0.1"
chacha20 = "0.9"

# Hashes
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sm3 = "0.4"
ripemd = "0.1"
sha3 = "0.10"
digest = "0.10"

# HMAC
hmac = "0.12"

# Encodings
hex = "0.4"
base64 = "0.22"

# Concurrency / file dialog
rayon = "1.10"
rfd = "0.14"

# PNG 解码 (仅用于加载窗口图标)
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
