name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: KeyHound-windows-x86_64.exe
          - os: macos-latest
            asset_name: KeyHound-macos-universal.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release

      - name: Build (macOS Universal)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create target/x86_64-apple-darwin/release/keyhound \
                      target/aarch64-apple-darwin/release/keyhound \
               -output target/release/keyhound

      - name: Prepare Assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/keyhound.exe dist/${{ matrix.asset_name }}

      - name: Prepare Assets (macOS .app bundle)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist
          APP="dist/KeyHound.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # 把通用二进制放到 Contents/MacOS/
          cp target/release/keyhound "$APP/Contents/MacOS/keyhound"
          chmod +x "$APP/Contents/MacOS/keyhound"

          # 由 PNG 生成多分辨率 icns
          mkdir -p icon.iconset
          sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
          cp assets/icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"

          # Info.plist (最小可用集)
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>KeyHound</string>
            <key>CFBundleDisplayName</key><string>KeyHound</string>
            <key>CFBundleIdentifier</key><string>com.maosource.keyhound</string>
            <key>CFBundleExecutable</key><string>keyhound</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundleVersion</key><string>0.1.1</string>
            <key>CFBundleShortVersionString</key><string>0.1.1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # 压成 zip (.app 本身是目录, GitHub Release 上传需要单文件)
          (cd dist && zip -r -y "${{ matrix.asset_name }}" KeyHound.app && rm -rf KeyHound.app)

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
